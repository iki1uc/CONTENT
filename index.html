<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CONTENT · SEED ⟁</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:40px; }
h1 { color:#6cf; }
pre { background:#111; padding:20px; border-left:3px solid #6cf; }

#content {
    width: 360px;
    height: 360px;
    margin: 40px auto;
    border: 3px solid #6cf;
    border-radius: 12px;
}
</style>
</head>

<body>

<h1>CONTENT · FRAME</h1>
<div id="content"></div>

<pre id="out">Lade CONTENT…</pre>

<script>
// =========================
//  SEED · Ursprung
// =========================
const SEED = "⟁";

// =========================
//  CONTENT · innerer Kern
// =========================
const CONTENT = {
    id: SEED,
    core: "C1",
    desc: "Innerer Inhalt eines Frames"
};

// =========================
//  Ausgabe
// =========================
document.getElementById("out").textContent =
    JSON.stringify(CONTENT, null, 2);
</script>

</body>
</html>
